name: scilab

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: scilab-api
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.scilab-api-http.entrypoints=http
      - traefik.http.routers.scilab-api-http.rule=Host(`scilab-api.epsilon.io.vn`)
      - traefik.http.routers.scilab-api-http.service=scilab-api
      - traefik.http.services.scilab-api.loadbalancer.server.port=80
    environment:
      - NODE_ENV=production
      - PORT=80
      - DATABASE_URL=postgresql://postgres:123@postgres:5432/scilab?schema=public
      - ADMIN_EMAIL=Admin@admin.com
      - ADMIN_PASSWORD=12345678
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=12345678
      - NEO4J_DATABASE=neo4j
      - NEO4J_MAX_CONNECTION_POOL_SIZE=50
      - NEO4J_CONNECTION_ACQUISITION_TIMEOUT=60000
      - NEO4J_CONNECTION_TIMEOUT=30000
      - NEO4J_MAX_TRANSACTION_RETRY_TIME=30000
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok
      - SERVICE_FQDN_API
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: scilab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: scilab
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    command: ["postgres", "-c", "timezone=Asia/Bangkok"]
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scilab"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: scilab-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/12345678
      TZ: Asia/Bangkok
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p 12345678 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
    name: scilab-postgres-data
  neo4j-data:
    name: scilab-neo4j-data
  neo4j-logs:
    name: scilab-neo4j-logs
