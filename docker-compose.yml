name: scilab

services:
  migrate:
    build:
      context: .
      dockerfile: services/academic-worker/Dockerfile
    container_name: scilab-migrate
    image: scilab-migrate
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @repo/database prisma:deploy && node dist/initialize.js",
      ]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:123@postgres:5432/scilab?schema=public
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=12345678
      - NEO4J_DATABASE=neo4j
      - NEO4J_MAX_CONNECTION_POOL_SIZE=50
      - NEO4J_CONNECTION_ACQUISITION_TIMEOUT=60000
      - NEO4J_CONNECTION_TIMEOUT=30000
      - NEO4J_MAX_TRANSACTION_RETRY_TIME=30000
      # - REDIS_HOST=redis
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - REDIS_DB=0
      - BULLMQ_PREFIX=scilab
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: scilab-api
    image: scilab-api
    restart: unless-stopped
    expose:
      - "6003"
    ports:
      - "6003:6003"
    labels:
      - traefik.enable=true
      - traefik.http.routers.scilab-api-http.entrypoints=http
      - traefik.http.routers.scilab-api-http.rule=Host(`scilab-api.epsilon.io.vn`)
      - traefik.http.routers.scilab-api-http.service=scilab-api
      - traefik.http.services.scilab-api.loadbalancer.server.port=6003
    environment:
      - NODE_ENV=production
      - PORT=6003
      - CLIENT_URL
      - DATABASE_URL=postgresql://postgres:123@postgres:5432/scilab?schema=public
      - SCIMAGO_DATASET_DIR=/app/docs/scimagojr/normalized
      - ADMIN_EMAIL=Admin@admin.com
      - ADMIN_PASSWORD=12345678
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=12345678
      - NEO4J_DATABASE=neo4j
      - NEO4J_MAX_CONNECTION_POOL_SIZE=50
      - NEO4J_CONNECTION_ACQUISITION_TIMEOUT=60000
      - NEO4J_CONNECTION_TIMEOUT=30000
      - NEO4J_MAX_TRANSACTION_RETRY_TIME=30000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - REDIS_DB=0
      - BULLMQ_PREFIX=scilab
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok
      - SERVICE_FQDN_API
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  academic-worker:
    build:
      context: .
      dockerfile: services/academic-worker/Dockerfile
    container_name: scilab-academic-worker
    image: scilab-academic-worker
    env_file:
      - ./services/academic-worker/.env
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:123@postgres:5432/scilab?schema=public
      - SCIMAGO_DATASET_DIR=/app/docs/scimagojr/normalized
      - OPENALEX_API_BASE_URL=https://api.openalex.org
      - OPENALEX_API_KEY=${OPENALEX_API_KEY:?Set OPENALEX_API_KEY in .env}
      - OPENALEX_JOURNAL_PRIORITY_PERCENT=${OPENALEX_JOURNAL_PRIORITY_PERCENT:-80}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=12345678
      - NEO4J_DATABASE=neo4j
      - NEO4J_MAX_CONNECTION_POOL_SIZE=50
      - NEO4J_CONNECTION_ACQUISITION_TIMEOUT=60000
      - NEO4J_CONNECTION_TIMEOUT=30000
      - NEO4J_MAX_TRANSACTION_RETRY_TIME=30000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - REDIS_DB=0
      - BULLMQ_PREFIX=scilab
      - TZ=Asia/Bangkok
      - PGTZ=Asia/Bangkok
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  schedule:
    build:
      context: .
      dockerfile: services/schedule/Dockerfile
    container_name: scilab-schedule
    image: scilab-schedule
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:123@postgres:5432/scilab?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - REDIS_DB=0
      - BULLMQ_PREFIX=scilab
      - TZ=Asia/Bangkok
    depends_on:
      redis:
        condition: service_healthy
      academic-worker:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: scilab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: scilab
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    command: ["postgres", "-c", "timezone=Asia/Bangkok"]
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scilab"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: scilab-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/12345678
      TZ: Asia/Bangkok
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scilab-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:6379:6379"
    command:
      [
        "sh",
        "-c",
        'redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: scilab-postgres-data
  neo4j-data:
    name: scilab-neo4j-data
  neo4j-logs:
    name: scilab-neo4j-logs
  redis-data:
    name: scilab-redis-data
