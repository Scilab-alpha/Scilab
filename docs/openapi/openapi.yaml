          type: number
          nullable: true
          example: 106.094
        hIndex:
          type: integer
          nullable: true
          example: 236
        totalDocs:
          type: integer
          nullable: true
          description: Total Docs. for the requested ranking year.
          example: 43
        totalDocs3Years:
          type: integer
          nullable: true
          example: 124
        totalRefs:
          type: integer
          nullable: true
          example: 3952
        totalCitations3Years:
          type: integer
          nullable: true
          example: 35985
        citableDocs3Years:
          type: integer
          nullable: true
          example: 89
        citationsPerDoc2Years:
          type: number
          nullable: true
          example: 387.59
        refsPerDoc:
          type: number
          nullable: true
          description: SCImago Ref. / Doc. for the requested ranking year.
          example: 91.91
        femalePercentage:
          type: number
          nullable: true
          example: 45.26
        countryCode:
          type: string
          nullable: true
          pattern: "^[A-Z]{2}$"
