openapi: 3.0.3
info:
  title: Scilab API
  version: 1.2.0
  description: API documentation for the Scilab backend.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Auth
    description: JWT-backed authentication sessions.
  - name: Users
    description: Authenticated user profile and admin user management.
  - name: Academic
    description: Public academic article and journal discovery.
  - name: Academic Graph
    description: Public graph exploration for OpenAlex related academic articles.
  - name: Bookmarks
    description: Authenticated user article bookmarks.
  - name: Follows
    description: Authenticated user follow targets and notification modes.
  - name: Notifications
    description: Authenticated user in-app notifications.
  - name: Events
    description: Authenticated realtime user event stream.
  - name: Push
    description: Authenticated push notification device registration.
paths:
  /auth/register:
    post:
      summary: Register a student account
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredUserResponseEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRegistrationInput"
        "409":
          $ref: "#/components/responses/EmailAlreadyRegistered"
  /auth/login:
    post:
      summary: Sign in with credentials
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponseEnvelope"
        "400":
          $ref: "#/components/responses/LoginBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/refresh:
    post:
      summary: Refresh access and refresh tokens
      operationId: refreshTokens
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Authentication refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenPairResponseEnvelope"
        "400":
          $ref: "#/components/responses/RefreshBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      summary: Return the authenticated user
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummaryResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: Revoke the current authenticated session
      operationId: logout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /academic/articles:
    get:
      summary: Search and filter academic articles with cursor pagination
      operationId: listAcademicArticles
      tags:
        - Academic
      parameters:
        - $ref: "#/components/parameters/AcademicQuery"
        - $ref: "#/components/parameters/AcademicKeywordId"
        - $ref: "#/components/parameters/AcademicTopicId"
        - $ref: "#/components/parameters/AcademicAuthorFilterId"
        - $ref: "#/components/parameters/AcademicJournalFilterId"
        - $ref: "#/components/parameters/AcademicPublicationYear"
        - $ref: "#/components/parameters/AcademicPublicationYearFrom"
        - $ref: "#/components/parameters/AcademicPublicationYearTo"
        - $ref: "#/components/parameters/AcademicPublisher"
        - $ref: "#/components/parameters/AcademicCountry"
        - $ref: "#/components/parameters/AcademicSort"
        - $ref: "#/components/parameters/AcademicCursor"
        - $ref: "#/components/parameters/AcademicLimit"
      responses:
        "200":
          description: Articles retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicArticleListResponseEnvelope"
        "400":
          $ref: "#/components/responses/AcademicArticleListInvalid"
  /academic/articles/{articleId}:
    get:
      summary: Return one academic article by id
      operationId: getAcademicArticleById
      tags:
        - Academic
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: Article retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicArticleResponseEnvelope"
        "404":
          $ref: "#/components/responses/ArticleNotFound"
  /academic/graphs/article/{id}:
    get:
      summary: Return a graph of OpenAlex related academic articles
      operationId: getAcademicArticleGraph
      tags:
        - Academic Graph
      security: []
      parameters:
        - $ref: "#/components/parameters/AcademicGraphArticleId"
        - $ref: "#/components/parameters/AcademicCursor"
        - $ref: "#/components/parameters/AcademicLimit"
      responses:
        "200":
          description: Article graph retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicArticleGraphVisualizationResponseEnvelope"
        "400":
          $ref: "#/components/responses/AcademicArticleGraphInvalid"
        "404":
          $ref: "#/components/responses/ArticleNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /academic/authors:
    get:
      summary: List academic authors with cursor pagination
      operationId: listAcademicAuthors
      tags:
        - Academic
      parameters:
        - $ref: "#/components/parameters/AcademicCursor"
        - $ref: "#/components/parameters/AcademicLimit"
      responses:
        "200":
          description: Authors retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicAuthorListResponseEnvelope"
        "400":
          $ref: "#/components/responses/AcademicCursorInvalid"
  /academic/authors/{authorId}:
    get:
      summary: Return one academic author by id
      operationId: getAcademicAuthorById
      tags:
        - Academic
      parameters:
        - $ref: "#/components/parameters/AuthorId"
      responses:
        "200":
          description: Author retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicAuthorResponseEnvelope"
        "404":
          $ref: "#/components/responses/AuthorNotFound"
  /academic/journals:
    get:
      summary: List academic journals with cursor pagination
      operationId: listAcademicJournals
      tags:
        - Academic
      parameters:
        - $ref: "#/components/parameters/AcademicCursor"
        - $ref: "#/components/parameters/AcademicLimit"
      responses:
        "200":
          description: Journals retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicJournalListResponseEnvelope"
        "400":
          $ref: "#/components/responses/AcademicCursorInvalid"
  /academic/journal-rankings:
    get:
      summary: List SCImago journal rankings for one exact year
      operationId: listAcademicJournalRankings
      tags:
        - Academic
      parameters:
        - $ref: "#/components/parameters/AcademicRankingYear"
        - $ref: "#/components/parameters/AcademicCursor"
        - $ref: "#/components/parameters/AcademicLimit"
      responses:
        "200":
          description: Journal rankings retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicJournalRankingListResponseEnvelope"
        "400":
          $ref: "#/components/responses/AcademicJournalRankingListInvalid"
        "404":
          $ref: "#/components/responses/JournalRankingDatasetNotFound"
  /academic/journals/{journalId}:
    get:
      summary: Return one academic journal by id
      operationId: getAcademicJournalById
      tags:
        - Academic
      parameters:
        - $ref: "#/components/parameters/JournalId"
      responses:
        "200":
          description: Journal retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicJournalResponseEnvelope"
        "404":
          $ref: "#/components/responses/JournalNotFound"
  /users/me:
    get:
      summary: Return the authenticated user profile
      operationId: getMyUser
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
    patch:
      summary: Update the authenticated user profile
      operationId: patchMyUser
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdatedResponseEnvelope"
        "400":
          $ref: "#/components/responses/UserInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/EmailAlreadyUsed"
  /users:
    get:
      summary: List users for admin management
      operationId: listUsers
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
  /users/{userId}:
    get:
      summary: Return one user for admin management
      operationId: getUserById
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
    patch:
      summary: Update one user profile for admin management
      operationId: patchUserById
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdatedResponseEnvelope"
        "400":
          $ref: "#/components/responses/UserInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/EmailAlreadyUsed"
    delete:
      summary: Delete one user for admin management
      operationId: deleteUserById
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDeletedResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
  /users/{userId}/role:
    patch:
      summary: Update one user role for admin management
      operationId: patchUserRole
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRolePatchRequest"
      responses:
        "200":
          description: User role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleUpdatedResponseEnvelope"
        "400":
          $ref: "#/components/responses/UserInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
  /users/{userId}/status:
    patch:
      summary: Update one user status for admin management
      operationId: patchUserStatus
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusPatchRequest"
      responses:
        "200":
          description: User status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatusUpdatedResponseEnvelope"
        "400":
          $ref: "#/components/responses/UserInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/UserNotFound"
  /bookmarks:
    get:
      summary: List current user bookmarks
      operationId: listBookmarks
      tags:
        - Bookmarks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Bookmarks retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkListResponseEnvelope"
        "400":
          $ref: "#/components/responses/BookmarkInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Toggle a bookmark for one article
      operationId: createBookmark
      tags:
        - Bookmarks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleBookmarkRequest"
      responses:
        "200":
          description: Bookmark toggled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleBookmarkResponseEnvelope"
        "400":
          $ref: "#/components/responses/BookmarkInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ArticleNotFound"
  /bookmarks/toggle:
    post:
      summary: Toggle a bookmark for one article
      operationId: toggleBookmark
      tags:
        - Bookmarks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleBookmarkRequest"
      responses:
        "200":
          description: Bookmark toggled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleBookmarkResponseEnvelope"
        "400":
          $ref: "#/components/responses/BookmarkInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ArticleNotFound"
  /follows:
    get:
      summary: List current user follows
      operationId: listFollows
      tags:
        - Follows
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FollowTypeQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Follows retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowListResponseEnvelope"
        "400":
          $ref: "#/components/responses/FollowInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /follows/toggle:
    post:
      summary: Toggle follow for a journal, keyword, or topic
      operationId: toggleFollow
      tags:
        - Follows
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleFollowRequest"
      responses:
        "200":
          description: Follow toggled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleFollowResponseEnvelope"
        "400":
          $ref: "#/components/responses/FollowInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FollowTargetNotFound"
  /follows/{objectType}/{objectId}/notify-mode:
    patch:
      summary: Update notification mode for a followed target
      operationId: updateFollowNotifyMode
      tags:
        - Follows
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FollowObjectTypePath"
        - $ref: "#/components/parameters/FollowObjectIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFollowNotifyModeRequest"
      responses:
        "200":
          description: Follow notification mode updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUpdatedResponseEnvelope"
        "400":
          $ref: "#/components/responses/FollowInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FollowNotFound"
  /events:
    get:
      summary: Subscribe to current user realtime events
      operationId: subscribeEvents
      tags:
        - Events
      description: Bearer-authenticated Server-Sent Events stream for current-user activity. Events are best-effort and are not replayed after reconnect.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User event stream opened.
          content:
            text/event-stream:
              schema:
                type: object
                required:
                  - eventId
                  - occurredAt
                  - type
                  - data
                additionalProperties: false
                properties:
                  eventId:
                    type: string
                    format: uuid
                  occurredAt:
                    type: string
                    format: date-time
                  type:
                    type: string
                    enum:
                      - notification.created
                      - notification.read
                      - notification.read_all
                      - bookmark.toggled
                      - follow.toggled
                      - follow.updated
                      - ping
                  data:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications:
    get:
      summary: List current user notifications
      operationId: listNotifications
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationReadQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Notifications retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponseEnvelope"
        "400":
          $ref: "#/components/responses/NotificationInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/unread-count:
    get:
      summary: Get current user unread notification count
      operationId: getUnreadNotificationCount
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unread notification count retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadNotificationCountResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/{notificationId}/read:
    patch:
      summary: Mark one notification as read
      operationId: markNotificationRead
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdPath"
      responses:
        "200":
          description: Notification marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadResponseEnvelope"
        "400":
          $ref: "#/components/responses/NotificationInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
  /notifications/read-all:
    patch:
      summary: Mark all current user notifications as read
      operationId: markAllNotificationsRead
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /push/devices/register:
    post:
      summary: Register current user push device
      operationId: registerPushDevice
      tags:
        - Push
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushDeviceRequest"
      responses:
        "200":
          description: Push device registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceRegisteredResponseEnvelope"
        "400":
          $ref: "#/components/responses/PushInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /push/devices/unregister:
    post:
      summary: Unregister current user push device
      operationId: unregisterPushDevice
      tags:
        - Push
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterPushDeviceRequest"
      responses:
        "200":
          description: Push device unregistered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushDeviceUnregisteredResponseEnvelope"
        "400":
          $ref: "#/components/responses/PushInputInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FollowTypeQuery:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FollowObjectType"
    FollowObjectTypePath:
      name: objectType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FollowObjectType"
    FollowObjectIdPath:
      name: objectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationReadQuery:
      name: isRead
      in: query
      required: false
      schema:
        type: boolean
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: string
    AcademicGraphArticleId:
      name: id
      in: path
      required: true
      description: OpenAlex work identifier for the hydrated root article.
      schema:
        type: string
    JournalId:
      name: journalId
      in: path
      required: true
      schema:
        type: string
    AuthorId:
      name: authorId
      in: path
      required: true
      schema:
        type: string
    AcademicCursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous page.
      schema:
        type: string
    AcademicRankingYear:
      name: year
      in: query
      required: true
      description: Exact SCImago ranking year. No fallback is applied.
      schema:
        type: integer
        minimum: 1000
    AcademicQuery:
      name: q
      in: query
      required: false
      description: Search article titles, abstracts, keywords, and topics.
      schema:
        type: string
        maxLength: 200
    AcademicKeywordId:
      name: keywordId
      in: query
      required: false
      description: Require an exact related keyword id.
      schema:
        type: string
    AcademicTopicId:
      name: topicId
      in: query
      required: false
      description: Require an exact related topic id.
      schema:
        type: string
    AcademicAuthorFilterId:
      name: authorId
      in: query
      required: false
      description: Require an exact author id.
      schema:
        type: string
    AcademicJournalFilterId:
      name: journalId
      in: query
      required: false
      description: Require an exact journal id.
      schema:
        type: string
    AcademicPublicationYear:
      name: publicationYear
      in: query
      required: false
      description: Exact publication year; mutually exclusive with year range.
      schema:
        type: integer
        minimum: 1000
    AcademicPublicationYearFrom:
      name: publicationYearFrom
      in: query
      required: false
      description: Inclusive publication year lower bound.
      schema:
        type: integer
        minimum: 1000
    AcademicPublicationYearTo:
      name: publicationYearTo
      in: query
      required: false
      description: Inclusive publication year upper bound.
      schema:
        type: integer
        minimum: 1000
    AcademicPublisher:
      name: publisher
      in: query
      required: false
      description: Publisher name matched exactly after normalization.
      schema:
        type: string
        maxLength: 255
    AcademicCountry:
      name: country
      in: query
      required: false
      description: ISO 3166-1 alpha-2 journal country code.
      schema:
        type: string
        minLength: 2
        maxLength: 2
    AcademicSort:
      name: sort
      in: query
      required: false
      description: Defaults to relevant for research queries and newest otherwise.
      schema:
        type: string
        enum:
          - relevant
          - newest
          - most_cited
    AcademicLimit:
      name: limit
      in: query
      required: false
      description: Number of records to return. Defaults to 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
