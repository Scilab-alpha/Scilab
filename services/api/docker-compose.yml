name: scilab

services:
  postgres:
    image: postgres:16-alpine
    container_name: scilab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: scilab
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scilab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: scilab-postgres-data
